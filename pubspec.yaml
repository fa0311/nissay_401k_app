name: nissay_401k
description: NISSAY 401k account management app built with Flutter.
publish_to: none
version: 0.0.5+5

environment:
  sdk: ^3.12.2
  flutter: ^3.44.6

workspace:
  - packages/nissay_client
  - packages/nissay_lints

dependencies:
  collection: ^1.19.1
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  github: ^9.25.0
  go_router: ^17.2.0
  hooks_riverpod: ^3.3.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  nissay_client: ^0.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  pub_semver: ^2.2.0
  riverpod_annotation: ^4.0.3
  talker_dio_logger: ^5.1.16
  talker_flutter: ^5.1.16
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.2.1
  json_serializable: ^6.14.0
  nissay_lints: ^0.1.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_background: "#FFFFFF"
