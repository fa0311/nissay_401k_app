name: nissay_401k
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.11.4
  flutter: ^3.41.6

workspace:
  - packages/nissay_client

dependencies:
  collection: ^1.19.1
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.0
  hooks_riverpod: ^3.3.1
  intl: ^0.20.2
  json_annotation: ^4.11.0
  nissay_client: ^0.1.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  talker_flutter: ^5.1.16
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.2.1
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  yumemi_lints: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_background: "#FFFFFF"
