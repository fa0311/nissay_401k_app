name: Android Release

on:
  push:
    paths:
      - pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from pubspec.yaml
        id: version
        run: |
          full_version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          release_version=$(echo "$full_version" | cut -d+ -f1)
          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub Release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.release_version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.release_version }} already exists. Skipping build and release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.release_version }} does not exist. Continuing."
          fi

  release-android:
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.release_exists != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Run build_runner (root)
        run: dart run build_runner build -d

      - name: Run build_runner (packages/nissay_client)
        working-directory: packages/nissay_client
        run: dart run build_runner build -d

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nissay_401k-${{ needs.check-release.outputs.full_version }}-android-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.release_version }}
          name: ${{ needs.check-release.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/nissay_401k-${{ needs.check-release.outputs.full_version }}-android-release.apk
